# 质量门禁：push / PR 时跑静态检查与测试（发版构建见 release.yml）。
# Python 3.8 / 3.10 / 3.12 矩阵：3.8 是 README 承诺的运行基线，3.12 是打包版本。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests tqdm pytest pytest-cov requests-mock ruff mypy

      - name: Ruff (语法错误 + pyflakes，风格规则渐进放开)
        run: >
          python -m ruff check shudaole/ tests/
          smartedu_downloader.py smartedu_downloader_gui.py auto_fetch_token.py

      # 类型检查宽松起步（只查 errors/config 两个纯函数模块），逐步收紧——见 ROADMAP P1-5
      - name: Mypy (core subset)
        if: matrix.python-version == '3.12'
        run: python -m mypy

      - name: Pytest
        run: >
          python -m pytest tests/ -q
          --cov=shudaole --cov-report=term --cov-fail-under=25
