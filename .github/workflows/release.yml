# 三平台自动打包：推送 v* 标签时，在 Windows / Linux / macOS 上分别用
# PyInstaller 构建，并把产物自动挂到对应 Release。
# 注意：Linux 包在 ubuntu-22.04 上构建（glibc >= 2.35）；macOS 包未签名，
# 用户首次运行需绕过 Gatekeeper（右键打开或 xattr -cr）。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # 可选代码签名：仓库 Secrets 配了 WINDOWS_CERT_PFX（base64）与
  # WINDOWS_CERT_PASSWORD 时自动对安装器签名，显著降低 SmartScreen 误报；
  # 未配置则跳过，流程照常（见 README「下载被拦截」一节）。
  WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
  WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows }
          - { os: ubuntu-22.04, platform: linux }
          - { os: macos-latest, platform: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"  # P1-2：缓存 pip 下载，缩短构建时间

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyinstaller

      - name: Build (PyInstaller)
        run: python -m PyInstaller build.spec --noconfirm

      - name: Package (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Compress-Archive -Path 'dist\书到了\*' -DestinationPath "ShudaoLe-${version}-windows-x64.zip" -Force

      - name: Build installer (windows, Inno Setup)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # windows-latest runner 自带 Inno Setup 6（ISCC 在 PATH）
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & ISCC.exe "/DVersion=${version}" installer.iss
          if (-not (Test-Path "ShudaoLe-${version}-setup.exe")) { throw "installer build failed" }

      - name: Sign installer (optional, only when cert secret configured)
        if: matrix.platform == 'windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          $pfx = [IO.Path]::GetTempFileName() + ".pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          try {
            $setup = (Get-ChildItem "ShudaoLe-*-setup.exe").FullName
            # /tr 时间戳保证证书过期后签名仍有效
            & signtool.exe sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $pfx /p $env:WINDOWS_CERT_PASSWORD $setup
            if ($LASTEXITCODE -ne 0) { throw "signtool failed (exit $LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx -Force
          }

      - name: Package (linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C dist -czf "ShudaoLe-${version}-linux-x64.tar.gz" "书到了"

      - name: Package .deb (linux, Debian/Ubuntu)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          # 原生 deb 包：/opt/shudaole 程序本体 + 应用菜单入口 + 图标
          pkg="pack_deb/shudaole_${version}_amd64"
          mkdir -p "$pkg/DEBIAN" "$pkg/opt/shudaole" \
            "$pkg/usr/share/applications" \
            "$pkg/usr/share/icons/hicolor/256x256/apps"
          cp -a "dist/书到了/." "$pkg/opt/shudaole/"
          cat > "$pkg/DEBIAN/control" <<CTL
          Package: shudaole
          Version: ${version}
          Architecture: amd64
          Maintainer: tau625 <tau625@users.noreply.github.com>
          Depends: libc6 (>= 2.35)
          Recommends: zenity
          Section: education
          Priority: optional
          Description: 书到了 (ShudaoLe) - 国家中小学智慧教育平台教材 PDF 下载
           本地网页界面，一键按学段/年级/科目/版本筛选并批量下载官方教材 PDF。
          CTL
          # 应用菜单入口（模板 Exec 路径与包内安装路径一致）
          cp packaging/shudaole.desktop "$pkg/usr/share/applications/shudaole.desktop"
          cp assets/app.png "$pkg/usr/share/icons/hicolor/256x256/apps/shudaole.png"
          chmod +x "$pkg/opt/shudaole/书到了"
          dpkg-deb --build --root-owner-group "$pkg"
          mv "pack_deb/shudaole_${version}_amd64.deb" "ShudaoLe-${version}-linux-x64.deb"

      - name: Package (macos)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # PyInstaller BUNDLE 已产出原生 书到了.app（dist 下）；
          # 用 hdiutil 打成 .dmg 分发——用户打开后拖进 Applications 即完成安装
          set -e
          app="$(ls -d dist/*.app 2>/dev/null | head -1)"
          if [ -z "$app" ]; then echo "未找到 .app 产物"; ls dist; exit 1; fi
          echo "找到应用包: $app"
          version="${GITHUB_REF_NAME#v}"
          hdiutil create -volname "ShudaoLe ${version}" \
            -srcfolder "$app" -format UDZO \
            -ov "ShudaoLe-${version}-macos.dmg"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ShudaoLe-*

  checksums:
    # 三个平台的附件全部挂完后，生成整包 SHA256SUMS.txt 一起上传：
    # 用户可核对完整性；应用内更新器也用它校验下载结果（shudaole/update.py）
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets and generate SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir assets && cd assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'ShudaoLe-*' --clobber
          rm -f SHA256SUMS.txt
          sha256sum ShudaoLe-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --clobber
